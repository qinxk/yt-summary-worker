name = "yt-summary-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
CHANNELS     = '["UCkHrq03gWLLx6vjS2DOJ8aA"]'
GEMINI_MODEL = "gemini-2.5-flash"
SUMMARY_PROVIDER = "gemini"

[[kv_namespaces]]
binding = "KV"
id = "178d6588564149eb8b80d92d8d51386d"   # ← 换成你真实的 KV 命名空间 ID

# 敏感变量请用 wrangler secret 设置（不要写进 toml）：
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put API_TOKEN
#   npx wrangler secret put WECOM_WEBHOOK
